<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voltio El AB</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0a0a12;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    #lightning-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    #flash {
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.04s ease-in;
    }

    .card {
      position: relative;
      z-index: 2;
      max-width: 480px;
      width: 100%;
      background: rgba(15, 15, 25, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(150, 180, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .logo-wrapper {
      margin-bottom: 2rem;
    }

    .logo-wrapper img {
      max-width: 200px;
      max-height: 100px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #f5c518, transparent);
      margin: 2rem 0;
      opacity: 0.4;
    }

    .coming-soon {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #f5c518;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .message {
      font-size: 1rem;
      color: #aaa;
      line-height: 1.6;
    }

    footer {
      position: relative;
      z-index: 2;
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: #444;
    }
  </style>
</head>
<body>

  <canvas id="lightning-canvas"></canvas>
  <div id="flash"></div>

  <div class="card">

    <div class="logo-wrapper">
      <!-- Replace logo.png with your actual logo filename -->
      <img src="logo.png" alt="Voltio El AB logotyp" />
    </div>

    <h1>Voltio El AB</h1>
    <p class="tagline">Auktoriserade elektriker</p>

    <div class="divider"></div>

    <p class="coming-soon">Hemsida under uppbyggnad</p>
    <p class="message">

    </p>

  </div>

  <footer>
    &copy; 2026 Enkidu
  </footer>

  <script>
    const canvas = document.getElementById('lightning-canvas');
    const ctx = canvas.getContext('2d');
    const flash = document.getElementById('flash');

    let W, H;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Lightning bolt via recursive midpoint displacement ---
    function buildBolt(x1, y1, x2, y2, depth, segments) {
      if (depth === 0) {
        segments.push([x1, y1, x2, y2]);
        return;
      }
      const mx = (x1 + x2) / 2 + (Math.random() - 0.5) * (Math.abs(y2 - y1) * 0.8);
      const my = (y1 + y2) / 2 + (Math.random() - 0.5) * 10;
      buildBolt(x1, y1, mx, my, depth - 1, segments);
      buildBolt(mx, my, x2, y2, depth - 1, segments);

      // Random branch
      if (depth === 3 && Math.random() < 0.5) {
        const bx = mx + (Math.random() - 0.5) * W * 0.3;
        const by = my + Math.random() * (H * 0.3);
        buildBolt(mx, my, bx, by, depth - 2, segments);
      }
    }

    // --- Spark particles ---
    let sparks = [];

    function spawnSparks(x, y) {
      for (let i = 0; i < 28; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 1,
          decay: 0.025 + Math.random() * 0.03,
          size: 1.5 + Math.random() * 2
        });
      }
    }

    // --- Draw a single bolt (segments list) at given opacity ---
    function drawBolt(segments, opacity) {
      // Outer glow pass
      ctx.save();
      ctx.globalAlpha = opacity * 0.25;
      ctx.strokeStyle = '#a0c4ff';
      ctx.lineWidth = 6;
      ctx.shadowColor = '#6fb3ff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      for (const [x1, y1, x2, y2] of segments) {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      }
      ctx.stroke();

      // Core bright line
      ctx.globalAlpha = opacity;
      ctx.strokeStyle = '#e8f4ff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      for (const [x1, y1, x2, y2] of segments) {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      }
      ctx.stroke();
      ctx.restore();
    }

    // --- Active bolts list ---
    let bolts = [];
    let lastTime = 0;

    function triggerStrike() {
      const startX = W * (0.15 + Math.random() * 0.7);
      const startY = 0;
      const endX   = startX + (Math.random() - 0.5) * W * 0.4;
      const endY   = H * (0.5 + Math.random() * 0.5);

      const segments = [];
      buildBolt(startX, startY, endX, endY, 5, segments);

      bolts.push({ segments, opacity: 1, endX, endY });
      spawnSparks(endX, endY);

      // Screen flash
      flash.style.opacity = '0.18';
      setTimeout(() => { flash.style.opacity = '0'; }, 60);

      // Schedule next strike
      const delay = 1800 + Math.random() * 3500;
      setTimeout(triggerStrike, delay);
    }

    // --- Animation loop ---
    function animate(ts) {
      requestAnimationFrame(animate);

      // Fade the previous frame (trail effect)
      ctx.fillStyle = 'rgba(10, 10, 18, 0.35)';
      ctx.fillRect(0, 0, W, H);

      // Draw bolts, fade them out
      bolts = bolts.filter(b => b.opacity > 0.01);
      for (const b of bolts) {
        drawBolt(b.segments, b.opacity);
        b.opacity *= 0.88;
      }

      // Draw sparks
      sparks = sparks.filter(s => s.life > 0);
      for (const s of sparks) {
        ctx.save();
        ctx.globalAlpha = s.life * 0.9;
        ctx.fillStyle = s.life > 0.6 ? '#ffe87a' : '#ff9a3c';
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        s.x  += s.vx;
        s.y  += s.vy;
        s.vy += 0.12; // gravity
        s.life -= s.decay;
      }
    }

    requestAnimationFrame(animate);

    // First strike after a short pause so the page settles
    setTimeout(triggerStrike, 800);
  </script>

</body>
</html>
