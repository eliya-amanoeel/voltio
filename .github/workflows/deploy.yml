name: Build & Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, voltio]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject SMTP password into web.config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
        run: |
          $content = Get-Content "${{ github.workspace }}\web.config" -Raw
          $content = $content -replace '__SMTP_PASSWORD__', $env:SMTP_PASS
          [System.IO.File]::WriteAllText(
            "${{ github.workspace }}\web.config",
            $content,
            [System.Text.Encoding]::UTF8
          )
        shell: powershell

      - name: Install dependencies
        run: npm ci
        shell: powershell

      - name: Build React app
        run: npm run build
        shell: powershell

      - name: Deploy to IIS
        run: |
          $source      = "${{ github.workspace }}\dist"
          $destination = "C:\inetpub\wwwroot\voltio"
          robocopy $source $destination /E /IS /IT
          Copy-Item "${{ github.workspace }}\send.ashx" $destination -Force
          Copy-Item "${{ github.workspace }}\web.config" $destination -Force
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }
        shell: powershell
